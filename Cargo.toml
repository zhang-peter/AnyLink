[package]
name = "anylink"
version = "0.2.0"
edition = "2024"
description = "DAP-Link firmware flashing GUI built with GPUI Fast and probe-rs"
build = "build.rs"

[dependencies]
probe-rs = "0.32.0"
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
rfd = "0.15.4"

[build-dependencies]
winresource = "0.1.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
